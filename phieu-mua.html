<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phiếu Mua Hàng</title>
<meta name="theme-color" content="#e8ecf1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phiếu Mua">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="phieu-mua.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ── TOKENS ── */
:root{
  --bg:#e8ecf1;--fg:#1a1f28;--muted:#5a6270;
  --accent:#c0392b;--accent-g:rgba(192,57,43,.28);--accent-soft:rgba(192,57,43,.10);
  --green:#1a7a4a;--green-g:rgba(26,122,74,.25);
  --sh-d:#c1c7d0;--sh-l:#ffffff;
  --up:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  --up-sm:3px 3px 7px var(--sh-d),-3px -3px 7px var(--sh-l);
  --in:inset 2px 2px 6px var(--sh-d),inset -2px -2px 6px var(--sh-l);
  --r:14px;
  --fs-xs:12px;--fs-sm:13px;--fs-md:13px;--fs-lg:13px;--fs-xl:14px; /* thang cỡ chữ */
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1e2229;--fg:#e4e8ef;--muted:#7a8494;
  --sh-d:#13171d;--sh-l:#292f38;--accent-soft:rgba(192,57,43,.18);
}}
:root[data-theme=dark]{
  --bg:#1e2229;--fg:#e4e8ef;--muted:#7a8494;
  --sh-d:#13171d;--sh-l:#292f38;--accent-soft:rgba(192,57,43,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ── LAYOUT ── */
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--fg);
  display:flex;flex-direction:column;
  height:100dvh;
  padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0); /* inset-top do .sbar đảm nhiệm (tránh cộng đôi) */
}

/* STATUS BAR */
.sbar{
  flex-shrink:0;height:env(safe-area-inset-top,0);background:var(--bg);
}

/* HEADER */
.hdr{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  box-shadow:0 3px 10px var(--sh-d);z-index:10;
  background:var(--bg);
}
.hdr-mid{display:flex;flex-direction:column;align-items:center;gap:1px;}
.hdr-mid .co{font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;}
.hdr-mid h1{font-size:var(--fs-xl);font-weight:800;}
.pill{
  font-size:var(--fs-xs);font-weight:800;padding:3px 9px;border-radius:999px;
  background:var(--bg);box-shadow:var(--in);
}
.pill.online{color:var(--green);}
.pill.offline{color:var(--accent);}
.icon-btn{
  width:34px;height:34px;border:none;border-radius:50%;
  background:var(--bg);box-shadow:var(--up-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* TOAST */
.toast{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:10px 16px;
  font-size:var(--fs-sm);font-weight:700;color:#fff;
  display:flex;align-items:center;gap:8px;
  transform:translateY(-100%);
  transition:transform .3s ease;
  pointer-events:none;
}
.toast.show{transform:translateY(0);}
.toast.success{background:var(--green);box-shadow:0 3px 12px var(--green-g);}
.toast.error{background:var(--accent);box-shadow:0 3px 12px var(--accent-g);}
.toast svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;flex-shrink:0;}

/* PHIEU STRIP */
.phieu-strip{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 14px;
  border-bottom:1px solid var(--sh-d);
  background:var(--bg);
}
.phieu-strip .no{
  font-family:'JetBrains Mono',monospace;font-size:var(--fs-md);font-weight:700;color:var(--accent);
}
.phieu-strip .dt{font-size:var(--fs-sm);color:var(--muted);font-weight:600;}

/* ZONE */
.zone{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:0 10px;
  overflow:hidden;
}
.sec-row{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 2px 3px;
}
.sec-lbl{font-size:var(--fs-xs);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
.sec-add{
  font-size:var(--fs-md);font-weight:700;color:var(--accent);
  display:flex;align-items:center;gap:3px;cursor:pointer;
  background:none;border:none;padding:2px 4px;border-radius:6px;
}
.sec-btns{display:flex;align-items:center;gap:6px;}
.sec-add:active{opacity:.6;}
.sec-add svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;}

/* INFO BLOCK */
.info-block{
  flex-shrink:0;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding-bottom:4px;
}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.nm-in{
  width:100%;background:var(--bg);border:none;outline:none;
  box-shadow:var(--in);border-radius:10px;
  padding:7px 10px;
  font:600 var(--fs-md)/1 'Inter',sans-serif;color:var(--fg);
  -webkit-appearance:none;
}
.nm-in::placeholder{color:var(--muted);opacity:.5;font-weight:400;}

/* ITEMS WRAP */
.items-wrap{
  flex:1;min-height:0;
  background:var(--bg);border-radius:var(--r);box-shadow:var(--up);
  overflow:hidden;display:flex;flex-direction:column;
}
.items-list{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;}

/* EMPTY STATE */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);
}
.empty-state svg{width:36px;height:36px;fill:none;stroke:var(--sh-d);stroke-width:1.5;stroke-linecap:round;}
.empty-state p{font-size:var(--fs-sm);font-weight:600;}

/* ITEM ROW */
.item-row{
  flex:0 0 auto; /* cao theo nội dung, xếp nối tiếp từ đỉnh box */
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:8px 10px;
  border-bottom:1px solid var(--sh-d);
  gap:3px;
  transition:background .15s;
}
.item-row:last-child{border-bottom:none;}
.item-row:active{background:rgba(0,0,0,.03);}

.row1{display:flex;align-items:center;gap:5px;}
.tag{
  background:var(--accent-soft);color:var(--accent);
  font-size:var(--fs-xs);font-weight:800;
  padding:2px 5px;border-radius:999px;flex-shrink:0;
}
.item-name-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.item-name{font-size:var(--fs-lg);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-cat{color:var(--accent);font-weight:700;}
.seller{font-size:var(--fs-sm);font-weight:600;color:var(--muted);}
.x-btn{
  width:20px;height:20px;border:none;border-radius:50%;
  background:transparent;font-size:var(--fs-lg);color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;opacity:.5;padding:0;line-height:1;
}
.x-btn:active{opacity:1;color:var(--accent);}

.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.mf{display:flex;flex-direction:column;gap:2px;}
.mf label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.2px;}
.mv{
  background:var(--bg);box-shadow:var(--in);
  border-radius:7px;padding:clamp(3px,.8vh,5px) 6px;
  font:700 var(--fs-md)/1 'JetBrains Mono',monospace;
  color:var(--fg);border:none;outline:none;width:100%;
  -webkit-appearance:none;text-align:right;
}
.mv::placeholder{color:var(--muted);opacity:.4;font-weight:400;text-align:left;}

/* ACTION BAR */
.actions{
  flex-shrink:0;background:var(--bg);
  border-radius:20px 20px 0 0;
  box-shadow:0 -5px 14px var(--sh-d);
  display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
}
.act{
  height:clamp(42px,6.5vh,54px);
  border:none;border-radius:var(--r);
  background:var(--bg);box-shadow:var(--up-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;transition:box-shadow .15s,transform .1s;
}
.act:active{transform:scale(.96);box-shadow:var(--in);}
.act svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.act.primary{background:var(--accent);box-shadow:0 4px 14px var(--accent-g);}
.act.primary svg{stroke:#fff;}
.act.primary:active{box-shadow:var(--in);}
.act.sec svg{stroke:var(--accent);}

/* ── DIALOG (thêm hàng) ── */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{
  width:100%;background:var(--bg);
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s ease;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-title{font-size:var(--fs-lg);font-weight:800;margin-bottom:12px;}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.sheet-grid .full{grid-column:1/-1;}
.lbl-in{display:flex;flex-direction:column;gap:4px;}
.lbl-in label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.s-in{
  width:100%;background:var(--bg);border:none;outline:none;
  box-shadow:var(--in);border-radius:10px;
  padding:10px 12px;
  font:600 var(--fs-md)/1 'Inter',sans-serif;color:var(--fg);
  -webkit-appearance:none;
}
.s-in::placeholder{color:var(--muted);opacity:.4;font-weight:400;}
.s-in.mono{font-family:'JetBrains Mono',monospace;text-align:right;}
.sheet-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;}
.s-btn{
  height:46px;border:none;border-radius:12px;
  font:700 var(--fs-md)/1 'Inter',sans-serif;cursor:pointer;
  background:var(--bg);box-shadow:var(--up-sm);color:var(--muted);
}
.s-btn.ok{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-g);}
.s-btn:active{transform:scale(.97);}

/* ── SETTINGS OVERLAY ── */
.settings-sheet{
  width:100%;background:var(--bg);
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s ease;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.overlay.open .settings-sheet{transform:translateY(0);}
.settings-item{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}

/* ── PRINT PREVIEW ── */
#print-view{
  display:none;
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);
}
#print-view.show{display:flex;}
/* Thanh trên của màn In phiếu: cùng kích thước/vị trí với .hdr của màn chính */
.pv-hdr{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  box-shadow:0 3px 10px var(--sh-d);z-index:10;
  background:var(--bg);
}
.pv-hdr-sp{width:34px;height:34px;}
.pv-body{
  flex:1;min-height:0;overflow-y:auto;
  padding:6px;
}
.pv-page{
  max-width:420px;margin:0 auto 20px;
  background:#fff;border:1px solid #d1d5db;border-radius:6px;
  padding:6px 6px;font-family:'Inter',sans-serif;color:#1a1f28;
}
.pv-header,.pv-info,.pv-sign{padding-left:4px;padding-right:4px;}
.pv-header{border-bottom:3px solid #991b1b;padding-bottom:8px;margin-bottom:10px;}
.pv-company{font-size:15px;font-weight:800;color:#991b1b;letter-spacing:.6px;text-transform:uppercase;}
.pv-title{font-size:26px;font-weight:800;margin:0 0 4px;line-height:1.1;}
.pv-meta{display:flex;justify-content:space-between;font-size:12px;color:#1a1f28;font-weight:500;}
.pv-info{display:flex;flex-wrap:wrap;gap:2px 18px;margin-bottom:10px;font-size:11px;color:#5a6270;}
.pv-info b{color:#1a1f28;font-weight:700;}
table.pv-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;font-variant-numeric:tabular-nums;font-family:'Inter',sans-serif;}
table.pv-tbl th{background:#e2e8f0;color:#0f172a;border-bottom:2px solid #64748b;padding:6px 1px;font-size:11px;font-weight:800;text-transform:uppercase;line-height:1.25;vertical-align:middle;text-align:center;}
table.pv-tbl th.c{text-align:center;}
table.pv-tbl th.nm{padding-left:3px;white-space:nowrap;}
table.pv-tbl td{padding:5px 1px;border-bottom:1px solid #e2e8f0;vertical-align:top;font-weight:700;}
table.pv-tbl td.i{text-align:center;color:#64748b;}
table.pv-tbl td.nm{padding:5px 4px 5px 2px;text-align:left;}
table.pv-tbl td.r{text-align:right;white-space:nowrap;font-weight:700;}
table.pv-tbl td.m{padding-right:2px;font-weight:700;color:#0f172a;}
.pv-n{font-size:11px;font-weight:700;color:#111827;line-height:1.25;overflow-wrap:anywhere;}
.pv-c{font-size:11px;font-weight:700;color:#0284c7;line-height:1.25;overflow-wrap:anywhere;}
.pv-s{font-size:11px;font-weight:700;color:#b91c1c;line-height:1.25;overflow-wrap:anywhere;}
.pv-tf{display:grid;grid-template-columns:4% 38% 13% 12% 10% 23%;border-top:2px solid #991b1b;padding:8px 0;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:#991b1b;}
.pv-tf>span{padding:0 3px;white-space:nowrap;}
.pv-tf .tl{grid-column:1/3;text-align:center;text-transform:uppercase;}
.pv-tf .r{display:flex;justify-content:flex-end;padding-right:1px;}
.pv-tf .m{grid-column:4/7;padding-right:2px;}
.pv-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;text-align:center;font-size:11px;color:#1a1f28;}
.pv-sign .sk{font-weight:800;font-size:11px;margin-bottom:56px;}.actions.pv-actions{grid-template-columns:1fr 1fr;}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" id="toast-icon"></svg>
  <span id="toast-msg"></span>
</div>

<!-- HEADER -->
<div class="sbar"></div>
<div class="hdr">
  <div id="status-pill" class="pill offline" title="Đang kiểm tra kết nối database...">● v…</div>
  <div class="hdr-mid">
    <span class="co">Vina InterStarch</span>
    <h1>Phiếu Mua Hàng</h1>
  </div>
  <button class="icon-btn" onclick="openSettings()" aria-label="Cài đặt">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
  </button>
</div>

<!-- PHIEU STRIP -->
<div class="phieu-strip">
  <div>
    <div style="font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Số phiếu</div>
    <div class="no" id="phieu-no">PM---------</div>
  </div>
  <span class="dt" id="phieu-dt">--/--/----</span>
</div>

<!-- ZONE -->
<div class="zone">
  <div class="sec-row" style="padding-top:6px;">
    <span class="sec-lbl">Thông tin</span>
  </div>
  <div class="info-block">
    <div class="field">
      <label>Biển số xe</label>
      <input class="nm-in" id="bien-so" placeholder="51B-123.45" autocapitalize="characters" autocomplete="off">
    </div>
    <div class="field">
      <label>Ghi chú</label>
      <input class="nm-in" id="ghi-chu" placeholder="Ghi chú..." autocomplete="off">
    </div>
  </div>

  <div class="sec-row">
    <span class="sec-lbl">Hàng hóa</span>
    <div class="sec-btns">
      <button class="sec-add" onclick="addSampleItems()" aria-label="Thêm dữ liệu mẫu để test">Test</button>
      <button class="sec-add" onclick="openAddItem()" aria-label="Thêm hàng hóa">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="items-wrap">
    <div class="items-list" id="items-list">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
        <p>Chưa có hàng hóa</p>
      </div>
    </div>
  </div>
</div>

<!-- ACTION BAR -->
<div class="actions">
  <button class="act" onclick="saveDraft()" aria-label="Lưu tạm">
    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
  </button>
  <button class="act primary" onclick="chot()" aria-label="Chốt phiếu">
    <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  </button>
  <button class="act sec" onclick="showPrint()" aria-label="In phiếu">
    <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
  </button>
</div>

<!-- ADD ITEM OVERLAY -->
<div class="overlay" id="add-overlay" onclick="closeAdd(event)">
  <div class="sheet">
    <div class="sheet-title">Thêm hàng hóa</div>
    <div class="sheet-grid">
      <div class="lbl-in full">
        <label>Loại hàng hóa</label>
        <input class="s-in" id="f-hang" placeholder="Bã khoai lang..." autocomplete="off">
      </div>
      <div class="lbl-in full">
        <label>Phân loại (không bắt buộc)</label>
        <input class="s-in" id="f-phanloai" placeholder="vụn, mật, già..." autocomplete="off">
      </div>
      <div class="lbl-in full">
        <label>Tên người bán (NCC)</label>
        <input class="s-in" id="f-seller" placeholder="Nguyễn Văn A..." autocomplete="off">
      </div>
      <div class="lbl-in">
        <label>SL (kg)</label>
        <input class="s-in mono" id="f-sl" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
      </div>
      <div class="lbl-in">
        <label>% Tạp chất</label>
        <input class="s-in mono" id="f-tc" type="text" inputmode="decimal" placeholder="0,0" autocomplete="off">
      </div>
      <div class="lbl-in full">
        <label>Giá (đ/kg)</label>
        <input class="s-in mono" id="f-gia" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
      </div>
    </div>
    <div class="sheet-btns">
      <button class="s-btn" onclick="closeAdd()">Huỷ</button>
      <button class="s-btn ok" onclick="confirmAdd()">Thêm vào phiếu</button>
    </div>
  </div>

<script>
/* ══════════════════════════════
   CONFIG & STATE
══════════════════════════════ */
const DB_NAME='phieu_mua_db', STORE='pending';
let db=null, items=[], editIdx=-1;
let SB_URL='', SB_KEY='', NV_NAME='';
let currentPhieuNo='', isOnline=false;

/* ══════════════════════════════
   UTILS
══════════════════════════════ */
// Dấu chấm ngàn, dấu phẩy thập phân (VN)
function fmtNum(n, decimals=0){
  if(n===undefined||n===null||n==='') return '';
  const num=parseFloat(String(n).replace(/\./g,'').replace(',','.'));
  if(isNaN(num)) return n;
  return num.toLocaleString('vi-VN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function parseVN(s){
  // "12.000" → 12000; "3,5" → 3.5
  return parseFloat(String(s).replace(/\./g,'').replace(',','.'));
}
function toVN(num, decimals=0){
  if(!num&&num!==0) return '';
  return Number(num).toLocaleString('vi-VN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function nowDateStr(){
  const d=new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function yyyymmdd(d=new Date()){
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
let toastTimer=null;
function showToast(msg, type='success'){
  const t=document.getElementById('toast');
  const icon=document.getElementById('toast-icon');
  t.className='toast '+type;
  document.getElementById('toast-msg').textContent=msg;
  if(type==='success') icon.innerHTML='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
  else icon.innerHTML='<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ══════════════════════════════
   INDEXEDDB
══════════════════════════════ */
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('counter'))
        d.createObjectStore('counter',{keyPath:'key'});
    };
    req.onsuccess=e=>{res(e.target.result);};
    req.onerror=e=>rej(e);
  });
}
function idbGet(store,key){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}
function idbPut(store,val){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    const req=tx.objectStore(store).put(val);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}
async function idbGetAll(store){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}

/* ══════════════════════════════
   PHIEU NUMBER GENERATOR
   PM-YYYYMMDD-NNNN (sequential per year)
══════════════════════════════ */
async function nextPhieuNo(){
  const year=new Date().getFullYear();
  const key='counter_'+year;
  const rec=await idbGet('counter',key)||{key,val:0};
  rec.val+=1;
  await idbPut('counter',rec);
  const seq=String(rec.val).padStart(4,'0');
  return `PM-${yyyymmdd()}-${seq}`;
}

/* ══════════════════════════════
   SETTINGS
══════════════════════════════ */
/* Link cài nhanh: #cfg=<base64 JSON {url,key}>. Mở link -> lưu URL + key -> xoá hash khỏi thanh địa chỉ */
const b64enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const b64dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
function applySetupLink(){
  const m=/^#cfg=(.+)$/.exec(location.hash);
  if(!m) return false;
  try{
    const c=b64dec(decodeURIComponent(m[1]));
    const url=String(c.url||'').trim().replace(/\/+$/,'');
    const key=String(c.key||'').trim();
    if(!/^https:\/\/.+/.test(url)||!key) throw new Error('thiếu url/key');
    localStorage.setItem('sb_url',url);
    localStorage.setItem('sb_key',key);
    history.replaceState(null,'',location.pathname+location.search);
    return true;
  }catch(e){
    console.error('Link cài nhanh không hợp lệ',e);
    return false;
  }
}
async function copySetupLink(){
  const url=document.getElementById('sb-url').value.trim().replace(/\/+$/,'');
  const key=document.getElementById('sb-key').value.trim();
  if(!url||!key){showToast('Nhập URL và Anon key trước','error');return;}
  const link=location.origin+location.pathname+'#cfg='+encodeURIComponent(b64enc({url,key}));
  try{await navigator.clipboard.writeText(link);showToast('Đã sao chép link cài nhanh');}
  catch(e){prompt('Sao chép link:',link);}
}
function loadSettings(){
  const linked=applySetupLink();
  NV_NAME=localStorage.getItem('nv_name')||'';
  SB_URL=localStorage.getItem('sb_url')||'';
  SB_KEY=localStorage.getItem('sb_key')||'';
  if(linked) setTimeout(()=>showToast('Đã nhận cấu hình database từ link'),300);
}
function saveSettings(){
  NV_NAME=document.getElementById('nv-name').value.trim();
  SB_URL=document.getElementById('sb-url').value.trim().replace(/\/$/,'');
  SB_KEY=document.getElementById('sb-key').value.trim();
  localStorage.setItem('nv_name',NV_NAME);
  localStorage.setItem('sb_url',SB_URL);
  localStorage.setItem('sb_key',SB_KEY);
  closeSettings();
  showToast('Đã lưu cài đặt');
  checkDb();
}
function openSettings(){
  document.getElementById('nv-name').value=NV_NAME;
  document.getElementById('sb-url').value=SB_URL;
  document.getElementById('sb-key').value=SB_KEY;
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(e){
  if(!e||e.target===document.getElementById('settings-overlay'))
    document.getElementById('settings-overlay').classList.remove('open');
}

/* ══════════════════════════════
   ADD ITEM SHEET
══════════════════════════════ */
function openAddItem(){
  document.getElementById('f-hang').value='';
  document.getElementById('f-phanloai').value='';
  document.getElementById('f-seller').value='';
  document.getElementById('f-sl').value='';
  document.getElementById('f-tc').value='';
  document.getElementById('f-gia').value='';
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-hang').focus(),300);
}
function closeAdd(e){
  if(!e||e.target===document.getElementById('add-overlay'))
    document.getElementById('add-overlay').classList.remove('open');
}
function confirmAdd(){
  const hang=document.getElementById('f-hang').value.trim();
  const phanloai=document.getElementById('f-phanloai').value.trim();
  const seller=document.getElementById('f-seller').value.trim();
  const sl=document.getElementById('f-sl').value.trim();
  const tc=document.getElementById('f-tc').value.trim();
  const gia=document.getElementById('f-gia').value.trim();
  if(!hang){showToast('Nhập tên hàng hóa','error');return;}
  if(!seller){showToast('Nhập tên người bán','error');return;}
  items.push({hang,phanloai,seller,sl:parseVN(sl)||0,tc:parseVN(tc)||0,gia:parseVN(gia)||0});
  closeAdd();
  renderItems();
  const list=document.getElementById('items-list');
  list.scrollTop=list.scrollHeight; // dòng vừa thêm hiện ra ở cuối
}

/* ══════════════════════════════
   RENDER ITEMS
══════════════════════════════ */
function renderItems(){
  const list=document.getElementById('items-list');
  const empty=document.getElementById('empty-state');
  if(!items.length){
    list.innerHTML='';
    list.appendChild(empty);
    return;
  }
  list.innerHTML='';
  items.forEach((it,i)=>{
    const row=document.createElement('div');
    row.className='item-row';
    row.innerHTML=`
      <div class="row1">
        <span class="tag">${String(i+1).padStart(2,'0')}</span>
        <div class="item-name-wrap">
          <span class="item-name">${esc(it.hang)}${it.phanloai?` <span class="item-cat">${esc(it.phanloai)}</span>`:''}</span>
          <span class="seller">${esc(it.seller)}</span>
        </div>
        <button class="x-btn" onclick="removeItem(${i})">×</button>
      </div>
      <div class="row2">
        <div class="mf"><label>SL (kg)</label><input class="mv" value="${toVN(it.sl)}" onchange="updateItem(${i},'sl',this.value)" inputmode="decimal"></div>
        <div class="mf"><label>% Tạp chất</label><input class="mv" value="${toVN(it.tc,1)}" onchange="updateItem(${i},'tc',this.value)" inputmode="decimal"></div>
        <div class="mf"><label>Giá (đ/kg)</label><input class="mv" value="${toVN(it.gia)}" onchange="updateItem(${i},'gia',this.value)" inputmode="decimal"></div>
      </div>`;
    list.appendChild(row);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function removeItem(i){items.splice(i,1);renderItems();}
/* Nút Test: thêm dòng hàng mẫu (dữ liệu giả) vào phiếu đang nhập; chỉ nằm trong bộ nhớ tới khi bấm Lưu tạm/Chốt. */
function addSampleItems(){
  items.push(
    {hang:'Bã khoai lang',phanloai:'vụn',seller:'Nguyễn Văn A',sl:12500,tc:2.5,gia:1850},
    {hang:'Vỏ sắn tươi',phanloai:'màu trắng',seller:'Trần Thị B',sl:8300,tc:1.2,gia:2100},
    {hang:'Sắn lát khô',phanloai:'già',seller:'Phạm Văn D',sl:15200,tc:0.8,gia:4300}
  );
  renderItems();
  const list=document.getElementById('items-list');
  list.scrollTop=list.scrollHeight;
  showToast('Đã thêm 3 dòng mẫu (chưa lưu)');
}
function updateItem(i,field,val){items[i][field]=parseVN(val)||0;}

/* ══════════════════════════════
   INIT PHIEU
══════════════════════════════ */
async function initPhieu(){
  currentPhieuNo=await nextPhieuNo();
  document.getElementById('phieu-no').textContent=currentPhieuNo;
  document.getElementById('phieu-dt').textContent=nowDateStr();
}

/* ══════════════════════════════
   SAVE DRAFT (IndexedDB only)
══════════════════════════════ */
async function saveDraft(){
  const data=buildPayload(false);
  await idbPut(STORE,{...data, id:currentPhieuNo, synced:false});
  showToast(`Đã lưu tạm ${currentPhieuNo}`);
}

/* ══════════════════════════════
   CHOT PHIEU (lưu + sync)
══════════════════════════════ */
async function chot(){
  const bienSo=document.getElementById('bien-so').value.trim();
  if(!bienSo){showToast('Nhập biển số xe','error');return;}
  if(!items.length){showToast('Chưa có hàng hóa','error');return;}

  const data=buildPayload(true);
  await idbPut(STORE,{...data, id:currentPhieuNo, synced:false});

  if(isOnline && SB_URL && SB_KEY){
    await syncOne(data);
  } else {
    showToast(`Đã lưu tạm · Sẽ sync khi có mạng`);
  }
}

function buildPayload(final=false){
  return {
    phieu_no: currentPhieuNo,
    bien_so: document.getElementById('bien-so').value.trim(),
    ghi_chu: document.getElementById('ghi-chu').value.trim(),
    nv_thu_mua: NV_NAME,
    items: items.map(it=>({...it})),
    tong_sl: items.reduce((s,it)=>s+it.sl,0),
    created_at: new Date().toISOString(),
    final
  };
}

/* ══════════════════════════════
   SUPABASE SYNC
══════════════════════════════ */
async function syncOne(data){
  if(!SB_URL||!SB_KEY) return;
  try{
    const res=await fetch(`${SB_URL}/rest/v1/phieu_mua_hang`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':'Bearer '+SB_KEY,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({
        phieu_no: data.phieu_no,
        bien_so: data.bien_so,
        ghi_chu: data.ghi_chu,
        nv_thu_mua: data.nv_thu_mua,
        items: data.items,
        tong_sl: data.tong_sl,
        created_at: data.created_at
      })
    });
    if(res.ok||res.status===201||res.status===200){
      await idbPut(STORE,{id:data.phieu_no,...data,synced:true});
      showToast(`Đã chốt phiếu ${data.phieu_no}`,'success');
      await initPhieu(); items=[]; renderItems();
      document.getElementById('bien-so').value='';
      document.getElementById('ghi-chu').value='';
    } else {
      const err=await res.text();
      showToast('Lỗi sync: '+res.status,'error');
      console.error(err);
    }
  }catch(e){
    showToast('Không kết nối được Supabase','error');
    console.error(e);
  }
}

async function syncPending(){
  if(!isOnline||!SB_URL||!SB_KEY) return;
  const all=await idbGetAll(STORE);
  const pending=all.filter(r=>!r.synced&&r.final);
  for(const r of pending) await syncOne(r);
}

/* ══════════════════════════════
   PRINT PREVIEW
══════════════════════════════ */

        <span>${currentPhieuNo}</span>

      </div>
    </div>
    <div class="pv-info">
      <span>Biển số xe: <b>${esc(bienSo)}</b></span>
      ${ghiChu?`<span>Ghi chú: <b>${esc(ghiChu)}</b></span>`:''}
    </div>
    <table class="pv-tbl">
      <colgroup><col style="width:4%"><col style="width:38%"><col style="width:13%"><col style="width:12%"><col style="width:10%"><col style="width:23%"></colgroup>
      <thead><tr>
        <th class="c">#</th><th class="nm">Thông tin hàng hóa</th>
        <th>SL (kg)</th><th>% Tạp</th><th>Giá</th><th>Thành tiền</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="pv-tf"><span class="tl">Tổng:</span><span class="r">${toVN(tongSL)}</span><span class="r m">${toVN(Math.round(tongTien))}</span></div>
    <div class="pv-sign">
      <div><div class="sk">Người bán</div>(Ký, ghi họ tên)</div>
      <div><div class="sk">NV Thu mua</div>(Ký, ghi họ tên)</div>
    </div>`;  document.getElementById('print-view').classList.add('show');
}
function hidePrint(){document.getElementById('print-view').classList.remove('show');}

async function downloadPrint(){

  try{
    const {default:html2canvas}=await import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js');

    link.click();
  }catch{
    window.print();

/* ══════════════════════════════
   ONLINE / OFFLINE
══════════════════════════════ */
let APP_VER='';
async function hostVersion(){
  try{
    const t=await (await fetch('/PhieuMuaHang/phieu-mua-sw.js',{cache:'no-store'})).text();
    const m=t.match(/const VERSION='([^']+)'/);
    return m?m[1]:'';
  }catch{return '';}
}
function swVersion(){
  return new Promise(res=>{
    const c=navigator.serviceWorker&&navigator.serviceWorker.controller;
    if(!c) return res('');
    const ch=new MessageChannel();
    ch.port1.onmessage=e=>res(e.data||'');
    c.postMessage('GET_VERSION',[ch.port2]);
    setTimeout(()=>res(''),1500);
  });
}
async function loadVersion(){
  APP_VER=(await swVersion())||(await hostVersion());
  paintPill(dbOk);
}
// So version đang chạy với version trên host; lệch -> tải SW mới, SW tự kích hoạt và trang tự reload
let swReg=null;
async function checkUpdate(){
  if(!swReg||!navigator.onLine) return;
  const host=await hostVersion(); if(!host) return;
  const run=await swVersion();
  const hasCtl=!!navigator.serviceWorker.controller;
  if(hasCtl&&run!==host){
    try{await swReg.update();}catch{}
    if(swReg.waiting) swReg.waiting.postMessage('SKIP_WAITING');
  }
}

let dbOk=false, dbChecking=false;
function paintPill(ok){
  const pill=document.getElementById('status-pill');
  pill.textContent='● v'+(APP_VER||'…');
  pill.className='pill '+(ok?'online':'offline');
  pill.title=ok?'Đã kết nối database':(SB_URL&&SB_KEY?'Không kết nối được database':'Chưa cài đặt database');
}
// Xanh = gọi được Supabase; Đỏ = chưa cấu hình / mất mạng / lỗi
async function checkDb(){
  if(dbChecking) return;
  dbChecking=true;
  let ok=false;
  if(navigator.onLine && SB_URL && SB_KEY){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),6000);
    try{
      const res=await fetch(`${SB_URL}/rest/v1/phieu_mua_hang?select=phieu_no&limit=1`,{
        headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store',signal:ctl.signal
      });
      ok=res.ok;
    }catch{ok=false;}
    clearTimeout(to);
  }
  const was=dbOk; dbOk=ok; dbChecking=false;
  paintPill(ok);
  if(ok&&!was) syncPending();
}
function updateOnline(){
  isOnline=navigator.onLine;
  checkDb();
}
window.addEventListener('online',updateOnline);
window.addEventListener('offline',updateOnline);
setInterval(checkDb,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDb(); });

/* ══════════════════════════════
   INIT
══════════════════════════════ */
(async()=>{
  // SW
  if('serviceWorker' in navigator){
    const hadSW=!!navigator.serviceWorker.controller;
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!hadSW||reloaded) return; // lần cài đầu không cần reload
      reloaded=true; location.reload(); // có bản mới -> tải lại để áp dụng
    });
    navigator.serviceWorker.register('/PhieuMuaHang/phieu-mua-sw.js',{scope:'/PhieuMuaHang/',updateViaCache:'none'})
      .then(reg=>{
        swReg=reg;
        checkUpdate();
        document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
        window.addEventListener('online',checkUpdate);
        setInterval(checkUpdate,10*60*1000);
      }).catch(e=>console.error('SW register failed',e));
  }
  db=await openDB();
  loadSettings();
  loadVersion();
  updateOnline();
  await initPhieu();
  renderItems();

  // Nếu chưa có settings → mở settings
  if(!SB_URL||!SB_KEY) openSettings();

})();
</script>
</body>
</html>
